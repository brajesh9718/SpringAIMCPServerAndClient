spring.application.name=customer-mcp-client
server.port=8082

# OpenAI Configuration (Free Trial)
# Get free $5 credits from: https://platform.openai.com/account/billing/overview
# Valid for 3 months. Use model: gpt-4o-mini (cheapest option for free tier)
spring.ai.openai.api-key=${OPENAI_API_KEY}
#model configuration
spring.ai.openai.chat.model=gpt-4o-mini

# mcp server configuration
spring.ai.mcp.client.request-timeout=20s
spring.ai.mcp.client.streamable-http.connections.customer-server.url=http://localhost:8081
spring.ai.mcp.client.streamable-http.connections.customer-server.endpoint=/mcp